name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_management?schema=public
      JWT_ACCESS_SECRET: test_secret_access_key_lead_dev_2026
      JWT_REFRESH_SECRET: test_secret_refresh_key_lead_dev_2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client & Migrate
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run Backend Lint
        working-directory: ./backend
        run: npm run lint

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm run test

      - name: Run Backend E2E Tests
        working-directory: ./backend
        run: npm run test:e2e

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

  frontend-checks:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
